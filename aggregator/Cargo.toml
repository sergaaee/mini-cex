[package]
name = "aggregator"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { path = "../common" }
rust_decimal = "1.39.0"
tokio = { version = "1.48.0", features = ["full", "tracing"] }
serde_json = "1.0.145"
redis = { version = "0.32.7", features = ["aio", "tokio-comp", "streams"] }
serde = { version = "1.0.228", features = ["derive"] }
futures-util = "0.3.31"
tokio-tungstenite = { version = "0.28.0", features = ["native-tls"] }
futures = "0.3.31"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
console-subscriber = "0.4.1"
reqwest = { version = "0.13", features = ["json"] }
anyhow = "1.0"

# Prometheus metrics
prometheus = "0.13"
axum = "0.8"
lazy_static = "1.4"
log = "0.4.28"

[profile.release]
debug = true
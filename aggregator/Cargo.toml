[package]
name = "aggregator"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { path = "../common" }
rust_decimal = "1.39"
tokio = { version = "1.48", features = ["full", "tracing"] }
serde_json = "1"
redis = { version = "1.2", features = ["aio", "tokio-comp", "streams"] }
serde = { version = "1", features = ["derive"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
console-subscriber = "0.4"
reqwest = { version = "0.13", features = ["json"] }
anyhow = "1.0"

# Prometheus metrics
prometheus = "0.13"
axum = "0.8"
lazy_static = "1.4"
chrono = "0.4"

[profile.release]
debug = true
[package]
name = "aggregator"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { path = "../common" }
rust_decimal = "1.39.0"
tokio = { version = "1.34", features = ["full"] }
serde_json = "1.0.145"
redis = { version = "0.32.7", features = ["aio", "tokio-comp"] }
serde = { version = "1.0.228", features = ["derive"] }
futures-util = "0.3.31"
tokio-tungstenite = { version = "0.28.0", features = ["native-tls"] }
futures = "0.3.31"

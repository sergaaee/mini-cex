[package]
name = "common"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
rust_decimal = { version = "1.39", features = ["maths", "macros"] }
redis = { version = "1.2", features = ["aio", "tokio-comp", "streams"] }
axum = "0.6"
rust_decimal_macros = "1.39"
serde_json = "1.0"
thiserror = "2"
strum = "0.26"
strum_macros = "0.26"
async-trait = "0.1"
hex = "0.4"
reqwest = { version = "0.12", features = ["json"] }
hmac = "0.13"
sha2 = "0.11"
dotenvy = "0.15"
bpx-api-client = "0.20"
tracing = "0.1"
secp256k1 = { version = "0.29", features = ["recovery"] }
[package]
name = "common"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
rust_decimal = "1.39.0"
redis = { version = "0.32.7", features = ["aio", "tokio-comp"] }
axum = "0.6"
rust_decimal_macros = "1.39.0"
serde_json = "1.0"
thiserror = "2.0.17"
strum = "0.26"
strum_macros = "0.26"
async-trait = "0.1.89"
hex = "0.4.3"
reqwest = { version = "0.12.24", features = ["json"] }
hmac = "0.13.0-rc.2"
sha2 = "0.11.0-rc.2"
dotenvy = "0.15.7"
bpx-api-client = "0.7.2"
tracing = "0.1.41"
[package]
name = "execution-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
common = { path = "../common" }
tokio = { version = "1.48", features = ["full"] }
redis = { version = "0.32", features = ["aio", "tokio-comp", "streams"] }
rust_decimal = "1.39"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
prometheus = "0.13"
axum = "0.8"
lazy_static = "1.4"
serde = { version = "1.0", features = ["derive"] }

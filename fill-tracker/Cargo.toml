[package]
name = "fill-tracker"
version = "0.1.0"
edition = "2021"

[dependencies]
common = { path = "../common" }
tokio = { version = "1.48", features = ["full"] }
redis = { version = "1.2", features = ["aio", "tokio-comp", "streams"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
futures-util = "0.3"
rust_decimal = "1.39"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
bpx-api-client = { version = "0.20", features = ["ws"] }

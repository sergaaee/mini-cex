[package]
name = "position-manager"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "position-manager"
path = "src/main.rs"

[dependencies]
common = { path = "../common" }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-native-tls", "rust_decimal", "chrono"] }
redis = { version = "1.2", features = ["tokio-comp", "streams"] }
reqwest = { version = "0.12", features = ["json"] }
rust_decimal = { version = "1.39", features = ["serde-with-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"

[package]
name = "telegram-notifier"
version = "0.1.0"
edition = "2021"

[dependencies]
common = { path = "../common" }
tokio = { version = "1.48", features = ["full"] }
redis = { version = "0.32", features = ["aio", "tokio-comp", "streams"] }
rust_decimal = "1.39"
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
